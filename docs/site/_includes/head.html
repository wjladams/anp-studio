<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/anpstudio.css" | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon-32.png" | relative_url }}">
  <link rel="icon" type="image/png" sizes="48x48" href="{{ "/assets/favicon-48.png" | relative_url }}">
  <link rel="apple-touch-icon" href="{{ "/assets/apple-touch-icon.png" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <script type="module">
    const blocks = document.querySelectorAll('pre > code.language-mermaid');
    if (blocks.length) {
      const { default: mermaid } = await import(
        'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs'
      );
      mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
      for (const code of blocks) {
        const pre = code.parentElement;
        const graph = document.createElement('div');
        graph.className = 'mermaid';
        graph.textContent = code.textContent;
        pre.replaceWith(graph);
      }
      await mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
    }
  </script>
</head>
