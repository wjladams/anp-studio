name: Publish site

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y doxygen cmake g++ ruby-full ruby-bundler

      - name: Build Doxygen
        run: |
          cmake -S . -B build \
            -DANPSTUDIO_BUILD_DOCS=ON \
            -DANPSTUDIO_BUILD_GUI=OFF
          cmake --build build --target anpstudio_docs

      - name: Stage API docs for Jekyll
        run: |
          rm -rf docs/site/api
          mkdir -p docs/site/api
          cp -a build/docs/html/. docs/site/api/

      - name: Stage README for Jekyll
        run: |
          # Drop the GitHub-only title/icon so the site lockup is the brand header.
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path("README.md").read_text(encoding="utf-8")
          src = re.sub(r"^# ANP Studio\n+", "", src, count=1)
          src = re.sub(
              r"<p align=\"center\">\s*<img[^>]*>\s*</p>\n*",
              "",
              src,
              count=1,
              flags=re.IGNORECASE,
          )
          Path("docs/site/README.content.md").write_text(src.lstrip(), encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        run: |
          cd docs/site
          bundle config set --local path vendor/bundle
          bundle install
          bundle exec jekyll build -d ../../_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
